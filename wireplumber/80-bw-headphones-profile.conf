# Px7 S3 is silent with aptX HD on some systems but works with SBC. Match the
# model instead of a Bluetooth address so the rule remains useful after
# re-pairing or on another machine. Other Bluetooth devices retain their
# normal codec/profile policy.
monitor.bluez.rules = [
  {
    matches = [
      {
        device.name = "~bluez_card.*"
        device.description = "Px7 S3"
      }
    ]
    actions = {
      update-props = {
        device.profile = "a2dp-sink-sbc"
      }
    }
  }
]
